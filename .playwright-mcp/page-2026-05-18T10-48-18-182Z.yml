      - generic [ref=e5930]:
        - heading "Trusted by the best in business" [level=2] [ref=e5931]
        - paragraph [ref=e5933]: Railway supports great software teams wherever they are. Hear from some of the teams building their products on Railway.
        - link "Read customer stories →" [ref=e5934] [cursor=pointer]:
          - /url: /customers
      - generic [ref=e5935]:
        - generic [ref=e5936]:
          - img
          - paragraph [ref=e5938]: "\"On our previous rent day, we saw traffic of 1,500+ requests per second that were all being fulfilled in under 50 milliseconds, which is really great. Our technical team is really impressed with scale like that.\""
          - generic [ref=e5940]:
            - generic [ref=e5941]: Kartik Aggarwal
            - generic [ref=e5942]: Tech Lead at Bilt
        - generic [ref=e5943]:
          - img
          - paragraph [ref=e5945]: "\"Services that took 1 week to configure elsewhere take 1 day to spin up in Railway. Messy networking like on other cloud platforms doesn't exist on Railway. If you understand basic TCP, you're all set.\""
          - generic [ref=e5947]:
            - generic [ref=e5948]: Daniel Lobaton
            - generic [ref=e5949]: CTO at G2X
        - generic [ref=e5950]:
          - img
          - paragraph [ref=e5952]: "\"Railway streamlines and accelerates our entire operation. It gives us instant observability into our services and makes spinning up self-hosted third-party tools almost effortless. This reduces friction in experimentation and shortens our deployment cycles significantly.\""
          - generic [ref=e5954]:
            - generic [ref=e5955]: Daniel Moretti
            - generic [ref=e5956]: Co-Founder & CTO at Mappa
      - generic [ref=e5957]:
        - generic [ref=e5958]: ...and loved by developers
