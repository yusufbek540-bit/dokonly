    - generic [ref=e5962]:
      - generic [ref=e5963]:
        - generic [ref=e5965]:
          - generic [ref=e5966]: Thales Gelinger
          - generic [ref=e5967]: "@thalesgelinger_"
        - generic [ref=e5968]: Real talk, i’m love with @Railway, it took me about 2 minutes to setup my server with a postgres using postgis, a volume, and all env and databases and everything else keeps in the same project, pretty neat way to organize things
      - generic [ref=e5969]:
        - generic [ref=e5971]:
          - generic [ref=e5972]: Praveen Thirumurugan
          - generic [ref=e5973]: "@PraveenTcom"
        - generic [ref=e5974]: Initial impressions on using @Railway is amazing. Zero config deployment if a Dockerfile is ready to use. Will check for a month on how it comes to the pricing and usage billing part.
      - generic [ref=e5975]:
        - generic [ref=e5977]:
          - generic [ref=e5978]: Brib
          - generic [ref=e5979]: "@spanish_vanish"
        - generic [ref=e5980]: I'm super bullish for the @Railway. They just started with their self-owned servers. and their new start-up program is super exciting, let's see how it develops in the future.
      - generic [ref=e5981]:
        - generic [ref=e5983]:
          - generic [ref=e5984]: Kevin Jin
          - generic [ref=e5985]: "@itskevinjin"
        - generic [ref=e5986]: really gotta commend @Railway for allowing hard spending limits, I have never, ever seen this with any cloud provider. It's so refreshing to use a platform that isn't trying to extract maximal dollars from my wallet
      - generic [ref=e5987]:
        - generic [ref=e5989]:
