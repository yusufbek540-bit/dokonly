[project]
name = "dokonly-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Telegram
    "aiogram>=3.13.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    # Supabase (auth + storage helpers)
    "supabase>=2.5.0",
    # Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Task queue
    "arq>=0.26.0",
    "redis>=5.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # AI
    "openai>=1.40.0",
    # Storage (Cloudflare R2 via S3-compatible API)
    "boto3>=1.35.0",
    # i18n
    "babel>=2.15.0",
    # Utils
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
